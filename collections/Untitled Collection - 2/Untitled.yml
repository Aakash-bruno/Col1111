info:
  name: Untitled
  type: http
  seq: 1

http:
  method: GET
  url: google.com
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const rowData = res

        const columnDefinitions = [
          { field: "name", filter: true, floatingFilter: true },
          { field: "age", filter: true, floatingFilter: true },
          { field: "email", filter: true, floatingFilter: true },
          { field: "city", filter: true, floatingFilter: true }
        ];

        bru.visualize('table', {
          name: 'table',
          provider: 'ag-grid',
          props: { rowData, columnDefinitions }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: example
    request:
      url: google.com
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: "{}"
